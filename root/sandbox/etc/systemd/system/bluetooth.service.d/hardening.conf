# on top of Debian's: only the sockets of bluetooth, no kernel state
[Service]
ProtectClock=yes
ProtectHostname=yes
ProtectKernelLogs=yes
ProtectKernelModules=yes
ProtectProc=invisible
LockPersonality=yes
RestrictNamespaces=yes
RestrictSUIDSGID=yes
RestrictAddressFamilies=AF_UNIX AF_BLUETOOTH AF_NETLINK AF_ALG
SystemCallArchitectures=native
