# no update checks on GitHub, no popups at start
update:
  method: never
disableStartupPopups: true
git:
  paging:
    colorArg: always
    pager: delta --paging=never
gui:
  nerdFontsVersion: "3"
  showRandomTip: false
  theme:
    activeBorderColor:
      - "#e0a86a"
      - bold
    inactiveBorderColor:
      - "#555555"
    selectedLineBgColor:
      - "#222222"
    optionsTextColor:
      - "#8a8a8a"
    searchingActiveBorderColor:
      - "#e0a86a"
    inactiveViewSelectedLineBgColor:
      - "#191919"
    defaultFgColor:
      - "#e9e9e9"
    unstagedChangesColor:
      - "#d8625e"
    cherryPickedCommitFgColor:
      - "#0a0a0a"
    cherryPickedCommitBgColor:
      - "#cba6ce"
    markedBaseCommitFgColor:
      - "#0a0a0a"
    markedBaseCommitBgColor:
      - "#88bcdb"
