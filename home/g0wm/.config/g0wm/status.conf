# Status text of g0wm's bar, read by g0wm-status.sh.
# Written by ./status_gen on 2026-08-31 23:30.
# Quotes keep the spaces. In a format %v is the value and %i the
# icon; ram has %u and %t too, date and time are strftime formats.
# A colour is #RRGGBB or #RRGGBBAA, empty for the bar foreground.

modules = "date time battery"

interval = "1"
battery_interval = "30"

prefix = " "
separator = " "
suffix = " "

date_format = "%i %a %d %b"
time_format = "%i %H:%M"
battery_format = "%i %v%"
cpu_format = "cpu %v%"
ram_format = "ram %v%"
netdown_format = "down %v"
netup_format = "up %v"

net_interface = ""

icon_date = ""
icon_time = ""
icon_battery = "    "
icon_cpu = ""
icon_ram = ""
icon_netdown = ""
icon_netup = ""

color_date = ""
color_time = ""
color_battery = ""
color_cpu = ""
color_ram = ""
color_netdown = ""
color_netup = ""

battery_low = "20"
color_battery_low = ""
color_battery_charging = ""
