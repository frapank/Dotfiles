# Left click: information; middle: main action; right: settings or details.
# Scroll adjusts a value or changes the selected item.
# Status text of g0wm's bar, read by g0wm-status.sh.
# Written by ./status_gen on 2026-08-31 23:30.
# Quotes keep the spaces. In a format %v is the value and %i the
# icon; ram has %u and %t too, date and time are strftime formats.
# <module>_click_left/_middle/_right and _scroll_up/_down run a command.
# A colour is #RRGGBB or #RRGGBBAA, empty for the bar foreground.

modules = "rec mic cam dns maint timer reboot btbattery usbwait nightlight awake battery volume time"

# seconds between reads
# rec, nightlight and awake are also refreshed by SIGUSR1
rec_interval = "1"
nightlight_interval = "30"
awake_interval = "30"
mic_interval = "1"
cam_interval = "1"
time_interval = "1"
dns_interval = "5"
# maint: failed, running or postponed jobs
maint_interval = "5"
# timer: the one that rings first, or the one scrolled to, and 2/3 while
# there are more; only while there is one
timer_interval = "1"
# reboot: a newer kernel is installed than the one running
reboot_interval = "300"
# btbattery: the battery of the bluetooth headphones, while they are connected
btbattery_interval = "60"
# usbwait: a USB device left blocked, no answer to the question
usbwait_interval = "5"
battery_interval = "30"
# volume: read at once on a change through pactl subscribe, this is the fallback
volume_interval = "30"
date_interval = "60"

prefix = " "
separator = "  "
suffix = " "

date_format = "%i %a %d %b"
time_format = "%a %b %-d %-H:%M"
battery_format = "%i"
volume_format = "%i"
cpu_format = "cpu %v%"
ram_format = "ram %v%"
netdown_format = "down %v"
netup_format = "up %v"
rec_format = "%i %v"
mic_format = "%i"
cam_format = "%i"
dns_format = "%i"
maint_format = "%i %v"
timer_format = "%i %v"
reboot_format = "%i"
btbattery_format = "%i %v%"
usbwait_format = "%i"
nightlight_format = "%i"
awake_format = "%i"

