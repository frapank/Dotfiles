# Status text of g0wm's bar, read by g0wm-status.sh.
# Written by ./status_gen on 2026-08-31 23:30.
# Quotes keep the spaces. In a format %v is the value and %i the
# icon; ram has %u and %t too, date and time are strftime formats.
# <module>_click_left/_middle/_right and _scroll_up/_down run a command.
# A colour is #RRGGBB or #RRGGBBAA, empty for the bar foreground.

modules = "rec mic cam dns nightlight awake battery volume time"

# seconds between reads
rec_interval = "0.5"
nightlight_interval = "0.5"
awake_interval = "0.5"
mic_interval = "1"
cam_interval = "1"
time_interval = "1"
dns_interval = "5"
battery_interval = "30"
volume_interval = "2"
date_interval = "60"

prefix = " "
separator = "  "
suffix = " "

date_format = "%i %a %d %b"
time_format = "%a %b %-d %-H:%M"
battery_format = "%i"
volume_format = "%i"
cpu_format = "cpu %v%"
ram_format = "ram %v%"
netdown_format = "down %v"
netup_format = "up %v"
rec_format = "%i"
mic_format = "%i"
cam_format = "%i"
dns_format = "%i"
nightlight_format = "%i"
