defaultPref("privacy.resistFingerprinting.letterboxing", true);
// sandboxed apps can write the GNOME proxy settings
defaultPref("network.proxy.type", 0);
defaultPref("pdfjs.enableScripting", false);
defaultPref("media.webspeech.synth.enabled", false);

// G0wm theme (chrome/), the colors are written by script/g0wm-theme.py
defaultPref("toolkit.legacyUserProfileCustomizations.stylesheets", true);
defaultPref("layout.css.prefers-color-scheme.content-override", 0);
defaultPref("ui.accentcolor", "#e0a86a");
defaultPref("ui.accentcolortext", "#0a0a0a");
defaultPref("ui.highlight", "#e0a86a");
defaultPref("ui.highlighttext", "#0a0a0a");
defaultPref("ui.selecteditem", "#1c1c1c");
defaultPref("ui.selecteditemtext", "#e9e9e9");
// find in page
defaultPref("ui.textSelectAttentionBackground", "#e0a86a");
defaultPref("ui.textSelectAttentionForeground", "#0a0a0a");
defaultPref("ui.textHighlightBackground", "#7fa88a");
defaultPref("ui.textHighlightForeground", "#0a0a0a");
// pages without colors, PDFs, reader view
defaultPref("browser.display.background_color.dark", "#0a0a0a");
defaultPref("browser.display.foreground_color.dark", "#e9e9e9");
defaultPref("pdfjs.viewerCssTheme", 2);
defaultPref("reader.color_scheme", "custom");
defaultPref("reader.custom_colors.background", "#0a0a0a");
defaultPref("reader.custom_colors.foreground", "#e9e9e9");
defaultPref("reader.custom_colors.unvisited-links", "#8ab0c6");
defaultPref("reader.custom_colors.visited-links", "#c59dc8");
defaultPref("reader.custom_colors.selection-highlight", "#e0a86a");

// address bar without https:// and www.
defaultPref("browser.urlbar.trimHttps", true);
defaultPref("browser.urlbar.trimWww", true);
