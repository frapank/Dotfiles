# COMPILE FLAGS
COMMON_FLAGS="-march=native -O2 -pipe -fno-plt \
  -fstack-protector-strong \
  -fstack-clash-protection \
  -fno-semantic-interposition \
  -D_FORTIFY_SOURCE=3"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"
LDFLAGS="-Wl,-O1 -Wl,--as-needed \
  -Wl,-z,relro,-z,now \
  -Wl,-z,noexecstack \
  -Wl,--hash-style=both \
  -fuse-ld=mold \
  -pie"
RUSTFLAGS="-C target-cpu=native -C opt-level=2 -C link-arg=-fuse-ld=mold"

# BUILD
MAKEOPTS="-j11 -l9"
EMERGE_DEFAULT_OPTS="--keep-going --with-bdeps=y --verbose-conflicts \
  --jobs=6 --load-average=9 \
  --complete-graph=y --backtrack=50"

# FEATURES
FEATURES="
  parallel-fetch
  parallel-install
  ccache
  clean-logs
  fail-clean
  userpriv
  usersandbox
  pid-sandbox
  ipc-sandbox
"
PORTAGE_TMPDIR="/var/tmp/portage"

# LOGS
PORTAGE_LOGDIR="/var/log/portage"
PORTAGE_ELOG_CLASSES="log warn error"
PORTAGE_ELOG_SYSTEM="save"

# USE FLAGS
ACCEPT_KEYWORDS="~amd64"
USE="
  man X wayland vulkan opengl
  pipewire pipewire-pulse
  screencast dbus elogind
  policykit
  gbm drm gles2
  udev xdg ime
  -pulseaudio-daemon 
  -systemd -bluetooth
  -kde -gnome
  -smartcard -ibm -ieee1394 -ipod
  -clamav -cups -test
"

# HARDWARE
CPU_FLAGS_X86="aes avx avx2 bmi1 bmi2 f16c fma3 mmx mmxext pclmul popcnt rdrand sha sse sse2 sse3 sse4_1 sse4_2 sse4a ssse3"
LLVM_TARGETS="AMDGPU x86"
VIDEO_CARDS="amdgpu radeonsi"
INPUT_DEVICES="libinput"
ABI_X86="64 32"

# BOOT & LOCAL
LC_MESSAGES=C.UTF-8
GRUB_PLATFORMS="efi-64"
