name: integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  essential-install:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install VM tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils genisoimage openssh-client python3
      - name: First install, second install and rollback
        run: python3 .github/integration/run.py --output /tmp/dotfiles-integration
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-logs
          path: |
            /tmp/dotfiles-integration/*.log
            /tmp/dotfiles-integration/*.tar.gz
          if-no-files-found: warn
