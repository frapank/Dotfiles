### GENERAL
set -g history-limit 10000
set -g escape-time 10
set -g repeat-time 300
set -g focus-events on
set -g mouse on
set -g set-titles on
set -g set-titles-string "#T"
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1
setw -g aggressive-resize on
setw -g automatic-rename on

### DEFAULT TERMINAL
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
    'set -g default-terminal "tmux-256color"' \
    'if-shell "infocmp screen-256color >/dev/null 2>&1" \
        "set -g default-terminal screen-256color" \
        "if-shell \"infocmp xterm-256color >/dev/null 2>&1\" \"set -g default-terminal xterm-256color\" \"set -g default-terminal screen\""'

%if #{>=:#{version},3.2}
    set -ga terminal-overrides ",*:RGB"
%else
    set -ga terminal-overrides ",*256col*:Tc"
%endif

### KEY MODE (vi)
setw -g mode-keys vi
set -g status-keys vi

### PANE NAVIGATION
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

### PANE RESIZE
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

### COPY MODE
bind Escape copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi Escape send -X cancel

### CLIPBOARD
if-shell 'command -v wl-copy >/dev/null 2>&1' \
    'bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"' \
    'if-shell "command -v xclip >/dev/null 2>&1" \
        "bind -T copy-mode-vi y send -X copy-pipe-and-cancel \"xclip -selection clipboard -in\"" \
        "if-shell \"command -v pbcopy >/dev/null 2>&1\" \"bind -T copy-mode-vi y send -X copy-pipe-and-cancel pbcopy\" \"bind -T copy-mode-vi y send -X copy-selection-and-cancel\""'

### VIM INTEGRATION
%if #{>=:#{version},3.2}
    is_vim="#{m/r:(^|/)g?(view|n?vim?x?)(diff)?$,#{pane_current_command}}"
    bind -n C-h if-shell -F "#{is_vim}" "send-keys C-h" "select-pane -L"
    bind -n C-j if-shell -F "#{is_vim}" "send-keys C-j" "select-pane -D"
    bind -n C-k if-shell -F "#{is_vim}" "send-keys C-k" "select-pane -U"
    bind -n C-l if-shell -F "#{is_vim}" "send-keys C-l" "select-pane -R"
%else
    is_vim="ps -o state=,comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+/)?g?(view|n?vim?x?)(diff)?$'"
    bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
    bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
    bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
    bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
%endif
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R

# WINDOWS AUTO OPEN
