### APPEARANCE
set -g status-position bottom
set -g status-justify left
set -g status-interval 5

set -g status-style "bg=#000000,fg=#e5e5e5"
set -g pane-border-style "fg=#777777"
set -g pane-active-border-style "fg=#9d9d9d"
set -g message-style "bg=#000000,fg=#9d9d9d"
set -g mode-style "bg=#9d9d9d,fg=#000000"

setw -g window-status-style "fg=#777777"
setw -g window-status-current-style "fg=#9d9d9d"
setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #I:#W "

set -g status-left ""
set -g status-left-style "fg=#e5e5e5"
set -g status-right "#H "
set -g status-right-style "fg=#777777"

set -g clock-mode-colour "#9d9d9d"
